<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depo Footwear & Leather</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #d4af37;
        }
        header p {
            color: #aaaaaa;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        /* Category Navigation Tabs */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #d4af37;
            color: #121212;
            border-color: #d4af37;
        }
        /* Catalog Sections */
        .catalog-section {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        .catalog-section.active {
            display: block;
        }
        /* Two columns grid setup */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333333;
            text-align: center;
            padding-bottom: 12px;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .product-card h3 {
            font-size: 0.9rem;
            margin: 10px 5px 4px 5px;
            color: #ffffff;
        }
        .price {
            color: #d4af37;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .order-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 7px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .order-btn:hover {
            background-color: #20ba5a;
        }
        .empty-notice {
            text-align: center;
            color: #777;
            padding: 40px 20px;
            font-size: 0.95rem;
        }

        /* Modal Popup Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            position: relative;
        }
        .close-btn {
            color: #aaa;
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #fff;
        }
        .modal-title {
            color: #d4af37;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #c59b27;
        }
        .bank-details {
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: left;
        }
        .bank-details strong {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <h1>Depo Footwear & Leather</h1>
        <p>Handcrafted Custom Shoes & Luxury Collection</p>
    </header>
